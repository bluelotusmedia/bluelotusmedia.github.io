name: AI Blog Generator
on:
  schedule:
    - cron: '0 0,8,16 * * *' # Midnight, 8 AM, and 4 PM UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g @google/gemini-cli@latest
        
      - name: Trust Workspace
        run: gemini trust .
        
      - name: Generate Post
        run: node scripts/ai-writer.js
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(blog): new AI-generated post'
          title: 'New AI Insight: Automated Post'
          body: 'This post was automatically generated by the Blue Lotus AI Writer.'
          branch: ai-blog-post
          base: main
          labels: |
            ai-generated
            blog
