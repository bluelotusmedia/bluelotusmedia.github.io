name: AI Blog Generator
on:
  schedule:
    - cron: '0 0,8,16 * * *' # Midnight, 8 AM, and 4 PM UTC
  wokflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest
        
      - name: Generate Post (Automated)
        run: npm run blog:generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  GEMINI_CLI_TRUST_WORKSPACE: true

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(blog): new AI-generated post'
          title: 'New AI Insight: Automated Post'
          body: 'This post was automatically generated by the Blue Lotus AI Writer.'
          branch: ai-blog-post
          base: main
          labels: |
            ai-generated
            blog

      - name: AI Review & Auto-Merge
        if: steps.create-pr.outputs.pull-request-number
        run: node scripts/ai-reviewer.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                    GEMINI_CLI_TRUST_WORKSPACE: true
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
